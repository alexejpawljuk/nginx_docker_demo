server {
    listen 80;
    server_name 127.0.0.1 demo1.internal;

    location / {
        root   /WORKDIR/Demo_1/;
        index  index.html index.htm;
    }

    location ^~ /gesperrt/ {
        deny all;
        return 403;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

server {
    listen 90;
    server_name 127.0.0.1 demo2.internal;

    location / {
        root   /WORKDIR/Demo_2/;
        index  index.html index.htm;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}